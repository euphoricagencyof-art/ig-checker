name: check
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'     # страховка: если цепочка оборвалась, расписание её перезапускает
concurrency:
  group: check
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-jammy     # браузер уже внутри — без установки на каждом запуске
    steps:
      - uses: actions/checkout@v4
      - run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - run: pip install playwright==1.49.0 playwright-stealth requests
      - id: chk
        run: python check.py
        env:
          IG_SESSION: ${{ secrets.IG_SESSION }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_THREAD_ALERT: ${{ secrets.TG_THREAD_ALERT }}
          TG_THREAD_REPORT: ${{ secrets.TG_THREAD_REPORT }}
      # цепочка: ждём до 10 минут от старта и запускаем следующий замер (GITHUB_TOKEN может запускать workflow_dispatch)
      - name: next
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, time, requests
          t0 = int(os.environ["T0"]); wait = 600 - (time.time() - t0)
          if wait > 0: time.sleep(wait)
          r = requests.post(f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/check.yml/dispatches",
                            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
                            json={"ref": "main"}, timeout=30)
          print("next dispatch:", r.status_code)
          PY
